<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
  </defs>

  <!-- An open book: two pages meeting at a coloured spine. -->
  <rect x="8" y="20" width="112" height="88" rx="10" fill="url(#spine)"/>

  <!-- Left page -->
  <path d="M18 30 h40 a6 6 0 0 1 6 6 v56 a6 6 0 0 0 -6 -6 H18 a4 4 0 0 1 -4 -4 V34 a4 4 0 0 1 4 -4 z"
        fill="url(#page)"/>
  <!-- Right page, mirrored, reads right-to-left the way manga does -->
  <path d="M110 30 h-40 a6 6 0 0 0 -6 6 v56 a6 6 0 0 1 6 -6 h40 a4 4 0 0 0 4 -4 V34 a4 4 0 0 0 -4 -4 z"
        fill="url(#page)"/>

  <!-- Panel lines suggesting comic frames -->
  <g fill="#c0bfbc">
    <rect x="22" y="38" width="34" height="20" rx="2"/>
    <rect x="22" y="62" width="16" height="18" rx="2"/>
    <rect x="42" y="62" width="14" height="18" rx="2"/>
    <rect x="72" y="38" width="34" height="12" rx="2"/>
    <rect x="72" y="54" width="34" height="26" rx="2"/>
  </g>
</svg>
