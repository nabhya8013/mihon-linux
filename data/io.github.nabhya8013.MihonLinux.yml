# Flatpak manifest for Mihon for Linux.
#
# Build and install locally:
#
#     flatpak install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
#     flatpak-builder --user --install --force-clean build-dir \
#         data/io.github.nabhya8013.MihonLinux.yml
#
app-id: io.github.nabhya8013.MihonLinux
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

command: mihon-linux

finish-args:
  # GTK4 on Wayland, with an X11 fallback.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Sources are fetched over the network.
  - --share=network

  # Tracker OAuth tokens live in the login keyring.
  - --talk-name=org.freedesktop.secrets

  # The user picks their own local manga folder, so the portal handles access
  # rather than granting the whole home directory up front.
  - --filesystem=xdg-download
  - --filesystem=xdg-documents

# Python dependencies are declared in data/python3-requirements.json: every
# wheel pinned by hash, because a Flatpak build has no network access. Regenerate
# it after changing requirements.txt (PyGObject is left out, the GNOME runtime
# provides it):
#
#     grep -vE '^(PyGObject|#|\s*$)' requirements.txt > /tmp/req.txt
#     python3 flatpak-pip-generator --runtime org.gnome.Sdk//50 \
#         --prefer-wheels cffi,charset_normalizer,cryptography,curl_cffi,lxml,markupsafe,mutf8,protobuf,psutil,pyyaml,sqlalchemy,wcwidth \
#         --requirements-file=/tmp/req.txt --output data/python3-requirements
#
# flatpak-pip-generator comes from
# https://github.com/flatpak/flatpak-builder-tools/tree/master/pip
modules:
  - python3-requirements.json

  # The JVM bridge is not bundled: it needs a JDK, and extension APKs are user
  # supplied. Built-in sources work without it.
  - name: mihon-linux
    buildsystem: simple
    build-commands:
      - install -Dm755 data/mihon-linux-flatpak.sh ${FLATPAK_DEST}/bin/mihon-linux
      - mkdir -p ${FLATPAK_DEST}/share/mihon-linux-app
      - cp -r mihon ${FLATPAK_DEST}/share/mihon-linux-app/mihon
      - install -Dm644 run.py ${FLATPAK_DEST}/share/mihon-linux-app/run.py
      - install -Dm644 data/io.github.nabhya8013.MihonLinux.desktop
        ${FLATPAK_DEST}/share/applications/io.github.nabhya8013.MihonLinux.desktop
      - install -Dm644 data/io.github.nabhya8013.MihonLinux.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.nabhya8013.MihonLinux.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.nabhya8013.MihonLinux.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.nabhya8013.MihonLinux.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.nabhya8013.MihonLinux-symbolic.svg
        ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/io.github.nabhya8013.MihonLinux-symbolic.svg
      - install -Dm644 data/icons/hicolor/48x48/apps/io.github.nabhya8013.MihonLinux.png
        ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/io.github.nabhya8013.MihonLinux.png
      - install -Dm644 data/icons/hicolor/64x64/apps/io.github.nabhya8013.MihonLinux.png
        ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/io.github.nabhya8013.MihonLinux.png
      - install -Dm644 data/icons/hicolor/128x128/apps/io.github.nabhya8013.MihonLinux.png
        ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.nabhya8013.MihonLinux.png
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.nabhya8013.MihonLinux.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.nabhya8013.MihonLinux.png
    sources:
      - type: dir
        path: ..
